[package]
name = "mtr-ng"
version = "0.6.1"
edition = "2021"
rust-version = "1.89"
description = "A modern, feature-rich implementation of My Traceroute (MTR) with real-time network path visualization"
license = "MIT OR Apache-2.0"
authors = ["Edwin de Jong <edejong@fastmail.fm>"]
repository = "https://github.com/gedejong/mtr-ng"
homepage = "https://github.com/gedejong/mtr-ng"
documentation = "https://github.com/gedejong/mtr-ng#readme"
readme = "README.md"
keywords = ["network", "traceroute", "mtr", "networking", "diagnostics"]
categories = ["command-line-utilities", "network-programming"]
include = [
    "/src",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
    "/install/mtr-ng.1",
    "/install/completions",
]

# Read by `cargo deb` in .github/workflows/build-deb.yml.
[package.metadata.deb]
maintainer = "Edwin de Jong <edejong@fastmail.fm>"
copyright = "2024, Edwin de Jong <edejong@fastmail.fm>"
license-file = ["LICENSE-MIT", "4"]
extended-description = """
MTR-NG is a modern implementation of the My Traceroute (MTR) network diagnostic tool.
It combines the functionality of traceroute and ping in a single tool with beautiful
Unicode sparklines, real-time visualization, jitter analysis, and advanced column
customization. Perfect for network troubleshooting and monitoring.
"""
depends = "$auto"
# setcap, which postinst uses to grant CAP_NET_RAW
recommends = "libcap2-bin"
maintainer-scripts = "packaging/deb/"
section = "net"
priority = "optional"
assets = [
    ["target/release/mtr-ng", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/mtr-ng/", "644"],
    ["LICENSE-MIT", "usr/share/doc/mtr-ng/", "644"],
    ["LICENSE-APACHE", "usr/share/doc/mtr-ng/", "644"],
    ["install/mtr-ng.1", "usr/share/man/man1/", "644"],
    ["install/completions/mtr-ng.bash", "usr/share/bash-completion/completions/mtr-ng", "644"],
    ["install/completions/_mtr-ng", "usr/share/zsh/vendor-completions/", "644"],
    ["install/completions/mtr-ng.fish", "usr/share/fish/vendor_completions.d/", "644"],
]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
clap = { version = "4.6", features = ["derive"] }
tokio = { version = "1.45", features = ["full"] }
# "all" is required for Type::RAW / ICMP datagram sockets; don't rely on tokio enabling it.
socket2 = { version = "0.6", features = ["all"] }
# crossterm comes re-exported from ratatui, so the two versions cannot drift apart
ratatui = "0.30"
unicode-width = "0.2"
gethostname = "1"
serde = { version = "1", features = ["derive"] }
# --ipmap: HTTPS to RIPE IPmap, rustls with ring and webpki-roots, no system TLS
ureq = { version = "3", default-features = false, features = ["rustls"] }
serde_json = { version = "1", features = ["preserve_order"] }
chrono = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
rand = "0.10"
hickory-resolver = "0.26"
maxminddb = { version = "0.32", features = ["mmap"] }

# recvmsg and its control messages (hop limits; Linux ping sockets' error queue)
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The ICMP API, which probes without administrator rights
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_System_IO",
] }

[[bin]]
name = "mtr-ng"
path = "src/main.rs"

[dev-dependencies]
clap_mangen = "0.3"
clap_complete = "4.5"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
