[workspace]
members = ["cargo:."]

# Release builds with dist (https://github.com/axodotdev/cargo-dist). Pushing a
# tag vX.Y.Z runs .github/workflows/release.yml. After editing this file, run
# `dist generate` to rewrite that workflow; don't edit it by hand.
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "homebrew"]
# No Windows build yet: it probes, but has been tested only over loopback (BACKLOG X3e).
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false
# Extra files in every archive, at its top level
include = ["install/mtr-ng.1", "install/completions/mtr-ng.bash", "install/completions/_mtr-ng", "install/completions/mtr-ng.fish"]
# Where the formula goes, also named in the release notes
tap = "gedejong/homebrew-tap"
# publish-homebrew.yml (instead of dist's built-in "homebrew" job) adds the man
# page and the shell completions and uses the HOMEBREW_TAP_TOKEN_PAT secret. publish-crates.yml, with
# CARGO_REGISTRY_TOKEN, goes back in once gedejong can publish the crate (BACKLOG C10).
publish-jobs = ["./publish-homebrew"]
# build-deb.yml adds Debian packages to the release
global-artifacts-jobs = ["./build-deb"]

# Custom publish jobs otherwise get only id-token and packages; publish-crates
# checks out this repo. publish-homebrew pushes with its own token.
[dist.github-custom-job-permissions]
"publish-crates" = { contents = "read" }
"publish-homebrew" = { contents = "read" }
