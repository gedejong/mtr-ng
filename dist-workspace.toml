[workspace]
members = ["cargo:."]

# Release builds with dist (https://github.com/axodotdev/cargo-dist). Pushing a
# tag vX.Y.Z runs .github/workflows/release.yml. After editing this file, run
# `dist generate` to rewrite that workflow; don't edit it by hand.
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "homebrew"]
# No Windows build: it compiles but can't probe yet (BACKLOG X3e).
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false
# Extra files in every archive
include = ["install/mtr-ng.1"]
# The formula is pushed here with the HOMEBREW_TAP_TOKEN secret
tap = "edejong-dbc/homebrew-tap"
# publish-crates.yml uses the CARGO_REGISTRY_TOKEN secret
publish-jobs = ["homebrew", "./publish-crates"]
# build-deb.yml adds Debian packages to the release
global-artifacts-jobs = ["./build-deb"]
