name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

# Releases: release.yml (generated by dist), started by v* tags. Its plan job rejects
# a tag that does not match the Cargo.toml version.

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --locked --all-targets -- -D warnings

  # deny.toml: licences, duplicate crates and sources must pass. A new advisory
  # shows as a failed job but doesn't fail the run, so it can't block an
  # unrelated change; it still wants a look.
  deny:
    name: cargo-deny (${{ matrix.checks }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        checks: [advisories, bans licenses sources]
    continue-on-error: ${{ matrix.checks == 'advisories' }}
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check ${{ matrix.checks }}

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --locked
      - name: Build
        run: cargo build --locked

      # Real probes over loopback. Hop 1 only shows 127.0.0.1 if a reply came back,
      # so this proves the socket path works, not just the parsers.
      - name: Smoke test (Linux, raw socket needs root)
        if: runner.os == 'Linux'
        timeout-minutes: 2
        shell: bash
        run: |
          sudo ./target/debug/mtr-ng -r -c 2 -n 127.0.0.1 | tee smoke.txt
          grep -Eq '1\.\|-- +127\.0\.0\.1' smoke.txt
      - name: Smoke test (macOS, unprivileged ICMP)
        if: runner.os == 'macOS'
        timeout-minutes: 2
        shell: bash
        run: |
          ./target/debug/mtr-ng -r -c 2 -n 127.0.0.1 | tee smoke.txt
          grep -Eq '1\.\|-- +127\.0\.0\.1' smoke.txt
      - name: Smoke test (Windows, ICMP API)
        if: runner.os == 'Windows'
        timeout-minutes: 2
        shell: bash
        run: |
          ./target/debug/mtr-ng.exe -r -c 2 -n 127.0.0.1 | tee smoke.txt
          grep -Eq '1\.\|-- +127\.0\.0\.1' smoke.txt
          ./target/debug/mtr-ng.exe -r -c 2 -n ::1 | tee smoke6.txt
          grep -Eq '1\.\|-- +::1' smoke6.txt

  freebsd:
    name: Check (FreeBSD)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-freebsd
      - uses: Swatinem/rust-cache@v2
      - name: Type-check
        run: cargo check --locked --target x86_64-unknown-freebsd

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Read rust-version from Cargo.toml
        id: msrv
        run: echo "version=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      - name: Check
        run: cargo check --locked --all-targets
